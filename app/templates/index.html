<!DOCTYPE html>
<html>
<head>
    <title>FitBuddy - AI Fitness Plan Generator</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

    <h1>FitBuddy</h1>
    <h2>AI Fitness Plan Generator using Gemini Models</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form action="/generate-workout" method="post">

        <label>User ID</label>
        <input type="text" name="user_id" required>

        <label>Name</label>
        <input type="text" name="name" required>

        <label>Age</label>
        <input type="number" name="age" min="13" required>

        <label>Weight</label>
        <input type="text" name="weight" placeholder="Example: 55 kg" required>

        <label>Fitness Goal</label>
        <select name="goal" required>
            <option value="general wellness">General Wellness</option>
            <option value="weight management">Weight Management</option>
            <option value="muscle strength">Muscle Strength</option>
            <option value="flexibility">Flexibility</option>
        </select>

        <label>Workout Intensity</label>
        <select name="intensity" required>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
        </select>

        <button type="submit">Generate 7-Day Plan</button>

    </form>

</div>

</body>
</html>
